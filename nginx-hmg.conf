# Nginx (Ubuntu): HTTPS, redirects and security headers for hmgglobalgroup.com
# Certificate: sudo certbot --nginx -d hmgglobalgroup.com -d www.hmgglobalgroup.com

server {
    listen 80;
    server_name hmgglobalgroup.com www.hmgglobalgroup.com;
    return 301 https://hmgglobalgroup.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.hmgglobalgroup.com;
    ssl_certificate /etc/letsencrypt/live/hmgglobalgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hmgglobalgroup.com/privkey.pem;
    return 301 https://hmgglobalgroup.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hmgglobalgroup.com;
    root /var/www/hmgglobalgroup;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hmgglobalgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hmgglobalgroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
